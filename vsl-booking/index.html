<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Book en samtale | Manneprat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/vsl-assets/funnel.css?v=7" />
  <script src="/vsl-assets/track.js?v=3" defer></script>
</head>
<body class="side-booking">

<header class="top top--slank">
  <div class="container top__inner">
    <a href="/" class="logo">manneprat<span>.</span></a>
  </div>
</header>

<main>
  <div class="container">
    <div class="bk">
      <h1 class="bk__tittel">Book en gratis samtale</h1>
      <p class="bk__rolig">20 minutter med Fredrik der dere ser på situasjonen din.<br />Uforpliktende, og du trenger ikke forberede noe.</p>

      <!-- Fredriks Calendly: «Evalueringssamtale med Fredrik» -->
      <div class="bk__kalender" id="kalender"></div>

      <!-- Sosialt bevis: ekte utsagn fra Fredriks klienter (SITATER under). Vises ikke når listen er tom. -->
      <div class="sitater" id="sitater"></div>
    </div>
  </div>
</main>

<script>
  // Ekte, korte utsagn fra Fredriks klienter. Eksempel: { tekst: '…', navn: 'M., 41' }
  const SITATER = [
    { tekst: 'Sinnet styrte livet mitt. På tre måneder fikk jeg tilbake kontrollen, uten å undertrykke det.', navn: 'Anders, 44, samboerbrudd' },
    { tekst: 'Jeg tok testen på en søndag. Booket samtale på mandag. Det viktigste valget på mange år.', navn: 'Kristian, 31, forlovelsen brutt' },
    { tekst: 'Jeg trodde jeg bare skulle komme meg over henne. Jeg måtte komme tilbake til meg selv først.', navn: 'Marius, 38, etter 12 år i ekteskap' },
  ];
  const sitater = document.getElementById('sitater');
  SITATER.forEach((s) => {
    const f = document.createElement('figure');
    f.className = 'sitat';
    const q = document.createElement('blockquote'); q.textContent = '«' + s.tekst + '»';
    const c = document.createElement('figcaption'); c.textContent = s.navn;
    f.append(q, c); sitater.append(f);
  });
  if (!SITATER.length) sitater.remove();

  // Calendly innebygd. Annonse (utm_*) og hvilken video de kom fra følger med til Fredrik.
  const KALENDER = 'https://calendly.com/hei-manneprat/evalueringssamtale-med-fredrik';
  let utm = {}, video = '';
  try { utm = JSON.parse(sessionStorage.getItem('mp_utm') || '{}'); } catch (_) {}
  try { video = sessionStorage.getItem('mp_video') || ''; } catch (_) {}
  const p = new URLSearchParams({
    embed_domain: location.hostname, embed_type: 'Inline',
    hide_event_type_details: '1', hide_gdpr_banner: '1',
    background_color: '141821', text_color: 'e8e6e1', primary_color: 'c9814a',
  });
  ['utm_source', 'utm_medium', 'utm_campaign', 'utm_content'].forEach((k) => { if (utm[k]) p.set(k, utm[k]); });
  if (video || utm.utm_term) p.set('utm_term', video || utm.utm_term);
  const ramme = document.createElement('iframe');
  ramme.src = KALENDER + '?' + p.toString();
  ramme.title = 'Velg tidspunkt for samtalen';
  ramme.setAttribute('frameborder', '0');
  document.getElementById('kalender').append(ramme);

  // Sporing: Calendly sender hendelser til siden med postMessage
  const spor = (n, par, egen) => { if (window.mpTrack) mpTrack(n, par || {}, egen); };
  spor('Skjema_Vist', {}, true);
  let startet = false;
  window.addEventListener('message', (e) => {
    if (e.origin !== 'https://calendly.com' || !e.data || typeof e.data.event !== 'string') return;
    const h = e.data.event;
    if (h === 'calendly.page_height' && e.data.payload && e.data.payload.height) {
      ramme.style.height = Math.max(560, parseInt(e.data.payload.height, 10)) + 'px';
    }
    if (h === 'calendly.date_and_time_selected' && !startet) {
      startet = true; spor('Skjema_Startet', {}, true);
    }
    if (h === 'calendly.event_scheduled') {
      spor('Skjema_Utfylt', {}, true);
      try { sessionStorage.setItem('mp_takk', JSON.stringify({ fornavn: '', problem: 'vsl-booking' })); } catch (_) {}
      setTimeout(() => { window.location.href = '/takk.html'; }, 400);
    }
  });
</script>

</body>
</html>
