<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Book en samtale | Manneprat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/vsl-assets/funnel.css?v=5" />
  <script src="/vsl-assets/track.js?v=3" defer></script>
</head>
<body class="side-booking">

<header class="top top--slank">
  <div class="container top__inner">
    <a href="/" class="logo">manneprat<span>.</span></a>
  </div>
</header>

<main>
  <div class="container">
    <form class="bk" id="contactForm" novalidate data-clarity-mask="true">
      <h1 class="bk__tittel">Book en gratis samtale</h1>
      <p class="bk__rolig">Uforpliktende. Du trenger ikke forberede noe.</p>

      <div class="bk__kort">
        <ol class="bk__steg" aria-label="Steg">
          <li data-steg="1">Dato</li><li data-steg="2">Tid</li><li data-steg="3">Info</li>
        </ol>

        <section class="bk__del" id="del1">
          <p class="bk__sporsmal">Hvilken dag passer?</p>
          <div class="days" id="days"></div>
        </section>

        <section class="bk__del" id="del2" hidden>
          <p class="bk__sporsmal"><button type="button" class="bk__tilbake" data-til="1">‹</button><span>Hvilket tidspunkt <span id="valgtDag"></span>?</span></p>
          <div class="times" id="times"></div>
        </section>

        <section class="bk__del" id="del3" hidden>
          <p class="bk__sporsmal"><button type="button" class="bk__tilbake" data-til="2">‹</button><span id="valgtTid"></span></p>
          <div class="bk__felt">
            <input type="text" id="bFornavn" autocomplete="given-name" placeholder="Fornavn" aria-label="Fornavn" required />
            <input type="email" id="bEpost" autocomplete="email" inputmode="email" placeholder="E-post" aria-label="E-post" required />
            <input type="tel" id="bTlf" autocomplete="tel" inputmode="tel" placeholder="Telefon" aria-label="Telefon" required />
          </div>
          <p class="form-error" id="bookingError" hidden>Noe gikk galt. Prøv igjen, eller skriv til hei@manneprat.no.</p>
          <button type="submit" class="btn btn--block">BOOK SAMTALEN</button>
        </section>
      </div>

      <!-- Sosialt bevis: ekte utsagn fra Fredriks klienter (SITATER under). Vises ikke når listen er tom. -->
      <div class="sitater" id="sitater"></div>
    </form>
  </div>
</main>

<script>
  // Ekte, korte utsagn fra Fredriks klienter. Eksempel: { tekst: '…', navn: 'M., 41' }
  const SITATER = [
    { tekst: 'Jeg trodde jeg bare skulle komme meg over henne. Jeg måtte komme tilbake til meg selv først.', navn: 'Marius, 38, etter 12 år i ekteskap' },
    { tekst: 'Sinnet styrte livet mitt. På tre måneder fikk jeg tilbake kontrollen, uten å undertrykke det.', navn: 'Anders, 44, samboerbrudd' },
    { tekst: 'Jeg tok testen på en søndag. Booket samtale på mandag. Det viktigste valget på mange år.', navn: 'Kristian, 31, forlovelsen brutt' },
  ];
  const sitater = document.getElementById('sitater');
  SITATER.forEach((s) => {
    const f = document.createElement('figure');
    f.className = 'sitat';
    const q = document.createElement('blockquote'); q.textContent = '«' + s.tekst + '»';
    const c = document.createElement('figcaption'); c.textContent = s.navn;
    f.append(q, c); sitater.append(f);
  });
  if (!SITATER.length) sitater.remove();

  // Dag og tid: de fem neste hverdagene med faste tider. Fredrik bekrefter tidspunktet på e-post.
  const days = document.getElementById('days');
  const dayNames = ['søn', 'man', 'tir', 'ons', 'tor', 'fre', 'lør'];
  const monthNames = ['jan', 'feb', 'mar', 'apr', 'mai', 'jun', 'jul', 'aug', 'sep', 'okt', 'nov', 'des'];
  const d = new Date();
  let added = 0;
  while (added < 10) {
    d.setDate(d.getDate() + 1);
    if (d.getDay() === 0 || d.getDay() === 6) continue;
    days.insertAdjacentHTML('beforeend',
      `<div><input type="radio" name="dag" id="dag_${added}" value="${dayNames[d.getDay()]} ${d.getDate()}. ${monthNames[d.getMonth()]}" required /><label for="dag_${added}"><small>${dayNames[d.getDay()]}</small>${d.getDate()}. ${monthNames[d.getMonth()]}</label></div>`);
    added++;
  }
  const times = document.getElementById('times');
  ['09:00', '10:30', '12:00', '14:00', '17:00', '19:00'].forEach((t, i) => {
    times.insertAdjacentHTML('beforeend',
      `<div><input type="radio" name="tid" id="tid_${i}" value="${t}" required /><label for="tid_${i}">${t}</label></div>`);
  });


  // Tre steg: dato, tid, info. Valget sender deg videre til neste steg.
  const deler = [1, 2, 3].map((n) => document.getElementById('del' + n));
  function visSteg(n) {
    deler.forEach((el, i) => { el.hidden = i !== n - 1; });
    document.querySelectorAll('.bk__steg li').forEach((li) => {
      li.classList.toggle('er-aktiv', +li.dataset.steg === n);
      li.classList.toggle('er-ferdig', +li.dataset.steg < n);
    });
    if (n === 3 && matchMedia('(min-width: 861px)').matches) document.getElementById('bFornavn').focus();
  }
  document.getElementById('days').addEventListener('change', (e) => {
    document.getElementById('valgtDag').textContent = e.target.value.replace(/^\S+ /, 'den ');
    visSteg(2);
  });
  document.getElementById('times').addEventListener('change', () => {
    const dag = document.querySelector('input[name="dag"]:checked').value;
    const tid = document.querySelector('input[name="tid"]:checked').value;
    document.getElementById('valgtTid').textContent = dag.charAt(0).toUpperCase() + dag.slice(1) + ' kl. ' + tid;
    visSteg(3);
  });
  document.querySelectorAll('.bk__tilbake').forEach((b) => b.addEventListener('click', () => visSteg(+b.dataset.til)));
  visSteg(1);

  // Send bookingen til booking.php (e-post til Fredrik + MailerLite)
  const form = document.getElementById('contactForm');
  const val = (sel) => { const el = form.querySelector(sel); return el ? el.value.trim() : ''; };
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    if (!form.checkValidity()) { form.reportValidity(); return; }
    const data = {
      fornavn: val('#bFornavn'), epost: val('#bEpost'), tlf: val('#bTlf'),
      dag: val('input[name="dag"]:checked'), tid: val('input[name="tid"]:checked'),
    };
    try { data.utm = JSON.parse(sessionStorage.getItem('mp_utm') || '{}'); } catch (_) { data.utm = {}; }
    try { data.video = sessionStorage.getItem('mp_video') || ''; } catch (_) {}
    const btn = form.querySelector('button[type="submit"]');
    btn.disabled = true;
    let ok = false;
    try {
      const res = await fetch('/booking.php', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) });
      ok = res.ok;
    } catch (_) {}
    if (ok) {
      try { sessionStorage.setItem('mp_takk', JSON.stringify({ fornavn: data.fornavn, problem: 'vsl-booking' })); } catch (_) {}
      window.location.href = '/takk.html';
      return;
    }
    btn.disabled = false;
    document.getElementById('bookingError').hidden = false;
  });
</script>

</body>
</html>
